<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .pulse-circle { animation: pulse 4s ease-in-out infinite alternate; }
    .rotate-shape { transform-origin: 1050px 180px; animation: spin 20s linear infinite; }
    @keyframes pulse {
      0% { r: 180px; opacity: 0.15; }
      100% { r: 240px; opacity: 0.35; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Glowing Background Elements (Behind Text) -->
  <circle cx="1050" cy="180" r="200" fill="#6366f1" class="pulse-circle" />
  <circle cx="150" cy="80" r="120" fill="#a855f7" opacity="0.15" />

  <!-- Animated Rotating Decorative Geometry (Side/Background) -->
  <g class="rotate-shape" opacity="0.25">
    <rect x="970" y="100" width="160" height="160" rx="20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="990" y="120" width="120" height="120" rx="15" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle cx="1050" cy="180" r="50" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Decorative Tech Grid lines -->
  <path d="M0 300 L1200 300 M0 330 L1200 330 M0 270 L1200 270" stroke="url(#grid-glow)" stroke-width="1"/>

  <!-- Foreground Content: Subtitle, Title, Badges -->
  <g transform="translate(70, 0)">
    <!-- Pill Category Tag -->
    <rect x="0" y="60" width="280" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="82" class="tag">🚀 HIGH-PERFORMANCE GRAPHICS</text>

    <!-- Main Title -->
    <text x="0" y="155" class="title">Awesome Multimedia Graphics API</text>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">Curated Guide to Vulkan, Metal, Direct3D 12, WebGPU, OpenGL &amp; GPU Compute</text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="120" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="60" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Vulkan 1.4</text>

      <rect x="132" y="0" width="110" height="32" rx="8" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="187" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🌐 WebGPU</text>

      <rect x="254" y="0" width="110" height="32" rx="8" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4"/>
      <text x="309" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🍎 Apple Metal</text>

      <rect x="376" y="0" width="120" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="436" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🎮 Direct3D 12</text>
    </g>
  </g>
</svg>
